<svg xmlns="http://www.w3.org/2000/svg" width="290" height="145" viewBox="0, 0, 870, 435">
  <defs>
    <linearGradient id="g1" gradientUnits="objectBoundingBox" gradientTransform="rotate(90)">
      <stop offset="0"    stop-color="rgb(170,000,170)"/>
      <stop offset="0.28" stop-color="rgb(170,000,170)"/>
      <stop offset="0.38" stop-color="rgb(255,040,000)"/>
      <stop offset="0.61" stop-color="rgb(255,040,000)"/>
      <stop offset="0.71" stop-color="rgb(242,231,000)"/>
      <stop offset="1"    stop-color="rgb(242,231,000)"/>
    </linearGradient>
  </defs>

  <!-- タイトル（位置は固定） -->
  <text x="12" y="48" font-family="Verdana" font-size="36">洪水災害の危険度（実況と予測で危険度を判定）</text>

  <!-- ▼ ここで凡例全体をオフセット（例：左に30→ translate(-30,0)） -->
