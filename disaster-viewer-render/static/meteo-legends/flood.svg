    <path d="M132 382 h 74 v 30 h -74 z" fill="rgb(60,255,255)" stroke="rgb(192,192,192)" stroke-width="4" />
    <text x="145" y="127" font-family="Verdana" font-size="48" fill="white">高</text>
    <text x="151" y="199" font-family="Verdana" font-size="36" fill="rgb(168,168,168)">危</text>
    <text x="151" y="241" font-family="Verdana" font-size="36" fill="rgb(168,168,168)">険</text>
    <text x="151" y="283" font-family="Verdana" font-size="36" fill="rgb(168,168,168)">度</text>
    <text x="145" y="356" font-family="Verdana" font-size="48" fill="black">低</text>
    <path d="M260  94 h 100 v 20 h -100 z" fill="rgb(012,000,012)" stroke="#303030" stroke-width="4" />
    <path d="M260 163 h 100 v 20 h -100 z" fill="rgb(170,000,170)" stroke="#303030" stroke-width="4" />
    <path d="M260 231 h 100 v 20 h -100 z" fill="rgb(255,040,000)" stroke="#303030" stroke-width="4" />
    <path d="M260 299 h 100 v 20 h -100 z" fill="rgb(242,231,000)" stroke="#303030" stroke-width="4" />
    <path d="M260 368 h 100 v 20 h -100 z" fill="rgb(60,255,255)" stroke="#303030" stroke-width="4" />

    <text x="376" y="118" font-family="Verdana" font-size="36">災害切迫【警戒レベル５相当】</text>
    <text x="376" y="187" font-family="Verdana" font-size="36">危険　　【警戒レベル４相当】</text>
    <text x="376" y="255" font-family="Verdana" font-size="36">警戒　　【警戒レベル３相当】</text>
